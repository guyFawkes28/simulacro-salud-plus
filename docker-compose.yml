services:
  postgres_db:
    image: postgres:15
    container_name: saludplus_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: saludplus
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  mongo_db:
    image: mongo:6
    container_name: saludplus_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: saludplus
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db

networks:
  default:
    name: saludplus_network